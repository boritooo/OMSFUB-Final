<!DOCTYPE html>
<html>
<head>
    <title>Superuser Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1e1e1e;
            color: #f5f5f5;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .card {
            background-color: #2c2c2c;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            margin-top: 40px;
        }
        h2 {
            text-align: center;
            color: #a4161a;
            margin-bottom: 25px;
            font-size: 28px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            padding: 12px 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            background-color: #3b3b3b;
            color: #f5f5f5;
        }
        input::placeholder {
            color: #b5b5b5;
        }
        button {
            padding: 12px;
            background-color: #a4161a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #811113;
        }
        label {
            margin-bottom: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Superuser Account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register Superuser</button>
        </form>
    </div>
</body>
</html>
